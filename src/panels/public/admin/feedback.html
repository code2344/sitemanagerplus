<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback • SiteManager+ Admin</title>
  <link rel="stylesheet" href="/admin/assets/style.css">
  <style>
    .feedback-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
      background: #fafafa;
    }

    .feedback-card.resolved {
      background: #f0f8f0;
      opacity: 0.8;
    }

    .feedback-card.archived {
      background: #f0f0f0;
      opacity: 0.6;
    }

    .feedback-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .feedback-title {
      flex: 1;
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .feedback-meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .feedback-type {
      display: inline-block;
      padding: 2px 8px;
      background: #007bff;
      color: white;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 8px;
      text-transform: uppercase;
    }

    .feedback-type.bug { background: #dc3545; }
    .feedback-type.suggestion { background: #28a745; }
    .feedback-type.question { background: #ffc107; color: #333; }
    .feedback-type.typo { background: #6c757d; }

    .feedback-status {
      display: inline-block;
      padding: 2px 8px;
      background: #e0e0e0;
      color: #333;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .feedback-status.open { background: #fff3cd; }
    .feedback-status.resolved { background: #d4edda; }
    .feedback-status.archived { background: #e2e3e5; }

    .feedback-element {
      font-size: 12px;
      background: white;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin: 8px 0;
      font-family: monospace;
      overflow-x: auto;
      color: #666;
    }

    .feedback-screenshot {
      max-width: 100%;
      max-height: 300px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin: 8px 0;
      cursor: pointer;
    }

    .feedback-message {
      margin: 8px 0;
      line-height: 1.5;
    }

    .feedback-comments {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
    }

    .comment {
      background: white;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 8px;
      border-left: 3px solid #007bff;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .comment-author {
      font-weight: 600;
      color: #333;
    }

    .comment-time {
      color: #999;
    }

    .comment-text {
      margin: 0;
      font-size: 14px;
      color: #555;
      line-height: 1.4;
    }

    .add-comment {
      margin-top: 12px;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .add-comment textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 8px;
    }

    .feedback-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .feedback-actions button {
      padding: 6px 12px;
      font-size: 12px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .filters select {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .feedback-list-empty {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .feedback-badge {
      display: inline-block;
      padding: 4px 8px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 8px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .modal-overlay.active {
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      z-index: 1001;
      max-width: 90vw;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal.active {
      display: block;
    }

    .modal-content {
      padding: 20px;
    }

    .modal-close {
      float: right;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
    }

    @media (prefers-color-scheme: dark) {
      .feedback-card {
        background: #2d2d2d;
        border-color: #444;
      }

      .feedback-element {
        background: #1f1f1f;
        border-color: #444;
        color: #bbb;
      }

      .comment {
        background: #1f1f1f;
        border-color: #444;
      }

      .add-comment {
        background: #1f1f1f;
        border-color: #444;
      }

      .add-comment textarea {
        background: #2d2d2d;
        color: #f0f0f0;
        border-color: #444;
      }

      .filters select {
        background: #2d2d2d;
        color: #f0f0f0;
        border-color: #444;
      }

      .modal {
        background: #2d2d2d;
        color: #f0f0f0;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">SiteManager+ • Feedback</div>
    <nav class="nav">
      <a href="/admin">Dashboard</a>
      <a href="/admin/metrics-ui">Metrics</a>
      <a href="/admin/api-keys-ui">API Keys</a>
      <a href="/admin/plugins-ui">Plugins</a>
      <a href="/admin/logs-ui">Logs</a>
      <a href="/admin/manual">Manual</a>
      <form method="post" action="/admin/logout" style="display:inline"><button class="btn small" type="submit">Logout</button></form>
    </nav>
  </header>
  <main class="page">
    <div class="hero">
      <h1>Feedback Management</h1>
      <p>View and manage element-level feedback from website visitors.</p>
      <div class="toolbar">
        <button class="btn" id="btnRefresh">Refresh</button>
      </div>
      <small id="status" class="note">Loading feedback...</small>
    </div>

    <div class="filters">
      <div>
        <label style="display: block; font-size: 12px; margin-bottom: 4px;">Status:</label>
        <select id="filterStatus">
          <option value="">All</option>
          <option value="open">Open</option>
          <option value="resolved">Resolved</option>
          <option value="archived">Archived</option>
        </select>
      </div>
      <div>
        <label style="display: block; font-size: 12px; margin-bottom: 4px;">Type:</label>
        <select id="filterType">
          <option value="">All</option>
          <option value="bug">Bug</option>
          <option value="suggestion">Suggestion</option>
          <option value="question">Question</option>
          <option value="typo">Typo</option>
        </select>
      </div>
      <div>
        <label style="display: block; font-size: 12px; margin-bottom: 4px;">Page:</label>
        <select id="filterPage">
          <option value="">All</option>
        </select>
      </div>
      <div>
        <label style="display: block; font-size: 12px; margin-bottom: 4px;">Submitter:</label>
        <select id="filterSubmitter">
          <option value="">All</option>
        </select>
      </div>
    </div>

    <div id="feedbackList" class="feedback-list"></div>
  </main>

  <div id="modalOverlay" class="modal-overlay"></div>
  <div id="screenshotModal" class="modal">
    <button id="modalClose" class="modal-close">&times;</button>
    <div class="modal-content">
      <img id="modalImage" src="" alt="Screenshot" style="max-width: 100%; height: auto;">
    </div>
  </div>

  <script src="/admin/assets/feedback.js"></script>
</body>
</html>
